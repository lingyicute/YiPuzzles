name: Verify and publish nightly

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Test, lint and build APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleNightly

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-input
          path: app/build/outputs/apk/nightly/*.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/web-tests" --no-package-lock --no-audit --no-fund playwright@1.65.1
          "$RUNNER_TEMP/web-tests/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run browser regression tests
        run: NODE_PATH="$RUNNER_TEMP/web-tests/node_modules" node --test tests/*.cjs

  publish:
    needs: [verify, web]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: nightly-input
          path: nightly-input

      - name: Install APK signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'

      - name: Sign and verify installable nightly APK
        env:
          NIGHTLY_KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
          NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          NIGHTLY_KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          NIGHTLY_KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
        run: |
          set -- nightly-input/*.apk
          test "$#" -eq 1 && test -f "$1"
          mkdir -p signed
          scripts/sign-nightly.sh "$1" "signed/yipuzzles-nightly-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.apk"

      - name: Publish nightly release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')
          if [[ "$head_sha" != "$GITHUB_SHA" ]]; then
            echo 'Skipping an outdated build.'
            exit 0
          fi
          apk=(signed/*.apk)
          asset=${apk[0]##*/}
          notes=$(printf 'Verified build · Commit: %s\n\nInstalls alongside stable. If the signing key changed, uninstall the previous nightly before installing (its local progress will be removed).\n' "$GITHUB_SHA")
          if gh release view nightly >/dev/null 2>&1; then
            # Keep the previous download until the new and verified asset is uploaded.
            gh release upload nightly "${apk[0]}"
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit nightly --title 'Nightly Build' --notes "$notes" --prerelease --latest=false
            gh release view nightly --json assets --jq '.assets[].name' | while IFS= read -r old; do
              [[ "$old" == "$asset" ]] && continue
              case "$old" in
                yipuzzles-nightly-*.apk|yipuzzles-release-*.apk) gh release delete-asset nightly "$old" --yes ;;
              esac
            done
          else
            gh release create nightly "${apk[0]}" \
              --title 'Nightly Build' --notes "$notes" \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi
